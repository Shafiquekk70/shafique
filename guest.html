<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook | SportsInfo Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #051d40;
            color: white;
            font-family: 'Poppins', sans-serif;
            padding-top: 70px;
        }
        
        .main-nav {
            background: rgba(4, 12, 101, 0.95);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .nav-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }
        
        .logo-highlight {
            color: #ffcc00;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: #ffcc00;
        }
        
        .guestbook-card {
            background: rgba(255, 255, 255, 0.05);
            border: 4px solid #ffcc00;
            border-radius: 20px;
            padding: 40px;
            margin-top: 30px;
        }
        
        .form-label { 
            color:white; 
            font-weight: 600; 
        }
        
        .form-control, .form-select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        
        .form-control:focus {
            background: rgba(0,0,0,0.5);
            border-color: #ffcc00;
            color: white;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.2);
        }
        
        .btn-submit {
            background: #ffcc00;
            color: #000;
            font-weight: 800;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        
        .btn-submit:hover {
            background: #ffd633;
        }
        
        .star-rating {
            display: inline-flex;
            font-size: 2rem;
        }
        
        .star-rating input {
            display: none;
        }
        
        .star-rating label {
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: 0.3s;
            margin: 0 5px;
        }
        
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #ffcc00;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
            display: none;
        }
        
        .alert-success {
            background-color: rgba(40, 167, 69, 0.2);
            color: #d4edda;
            border-left: 4px solid #28a745;
        }
        
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                gap: 20px;
            }
            
            .guestbook-card {
                padding: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            
            .guestbook-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">
                SPORTS<span class="logo-highlight">INFO</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
                <li><a href="contact.html" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Guestbook Form -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="text-center mb-5">
                    <h1 style="font-family: 'Oswald'; color: #ffcc00; font-size: 48px;">GUESTBOOK</h1>
                    <p class="text-muted">We value your feedback! Please leave your details below.</p>
                </div>
                
                <!-- Success Message -->
                <div id="successMessage" class="alert alert-success mb-3">
                    <i class="fas fa-check-circle me-2"></i>Thank you! Your feedback has been saved.
                </div>
                
                <div class="guestbook-card">
                    <form id="guestbookForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter your name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email Address *</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Visit *</label>
                                <input type="date" class="form-control" id="visitDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">City/Address</label>
                                <input type="text" class="form-control" id="location" placeholder="Your location">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Comments about the site</label>
                            <textarea class="form-control" id="comments" rows="4" placeholder="How was your experience?"></textarea>
                        </div>

                        <div class="row align-items-end">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Rate Our Site *</label>
                                <div class="star-rating">
                                    <input type="radio" name="rating" id="star5" value="5" required>
                                    <label for="star5">★</label>
                                    <input type="radio" name="rating" id="star4" value="4">
                                    <label for="star4">★</label>
                                    <input type="radio" name="rating" id="star3" value="3">
                                    <label for="star3">★</label>
                                    <input type="radio" name="rating" id="star2" value="2">
                                    <label for="star2">★</label>
                                    <input type="radio" name="rating" id="star1" value="1">
                                    <label for="star1">★</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label d-block">Would you recommend us? *</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="recommend" id="yes" value="yes" checked required>
                                    <label class="form-check-label" for="yes">Yes</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="recommend" id="no" value="no">
                                    <label class="form-check-label" for="no">No</label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit mt-4">
                            <i class="fas fa-paper-plane me-2"></i> SUBMIT ENTRY
                        </button>
                    </form>
                </div>
                
                <div class="mt-5 text-center text-muted">
                    <p><i class="fas fa-info-circle me-2"></i>Your feedback helps us improve our website.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        
    document.forms.guestbookForm.onsubmit = e => {
        e.preventDefault();
        const f = e.target;
        const entries = JSON.parse(localStorage.guestbookEntries || '[]');
        entries.push({
            id: Date.now(),
            fullName: f.fullName.value,
            email: f.email.value,
            visitDate: f.visitDate.value,
            location: f.location.value,
            comments: f.comments.value,
            rating: f.rating.value,
            recommend: f.recommend.value,
            date: new Date().toISOString()
        });
        localStorage.guestbookEntries = JSON.stringify(entries);
        f.reset();
        alert('Thank you! Feedback saved.');
    };
</script>


</body>
</html>
